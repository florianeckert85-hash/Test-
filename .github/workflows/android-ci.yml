name: Android CI

on:
  push:
    branches: ["**"]
  workflow_dispatch:

# Needed so the build can publish the APK as a GitHub Release.
permissions:
  contents: write

jobs:
  build:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Run unit tests
        run: ./gradlew test --stacktrace

      - name: Assemble debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload debug APK (workflow artifact)
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: warn

      # Publish a stable, direct .apk download link via a rolling pre-release.
      # Runs only on main and the active development branch.
      - name: Publish debug APK as rolling release
        if: >-
          github.ref == 'refs/heads/main' ||
          github.ref == 'refs/heads/claude/library-account-android-app-5oya8z'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: debug-latest
          name: "Debug APK (latest build)"
          body: |
            Automatisch gebaute Debug-Version zum Testen auf dem Handy.
            Direkt-Download: app-debug.apk (unten unter "Assets").
            Commit: ${{ github.sha }}
          prerelease: true
          files: app/build/outputs/apk/debug/*.apk
